version: '3.8'

services:
  app:
    build: .
    container_name: keyword_analyzer_app
    restart: unless-stopped
    ports:
      - "80:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=keyword_analyzer
      - DB_USER=keyword_user
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set}
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET must be set}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # You can add other environment variables like API keys here:
      # - SERPER_API_KEY=your_key
      # - SESSION_SECRET=a_very_long_random_string_at_least_32_chars
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  postgres:
    image: postgres:16-alpine
    container_name: keyword_analyzer_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=keyword_user
      - POSTGRES_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set}
      - POSTGRES_DB=keyword_analyzer
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keyword_user -d keyword_analyzer"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: keyword_analyzer_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:

networks:
  app-network:
    driver: bridge
